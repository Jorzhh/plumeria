<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D interactivo con Three.js</title>
    <link rel="stylesheet" href="visor3d-style.css?v=2">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="ui-info">Selecciona un objeto con el mouse</div>
    
    <!-- Botón para mostrar el panel manualmente -->
    <button id="btn-toggle-panel">Ver Preguntas</button>
    
    <div id="panel-respuestas">
        <!-- Botón para cerrar la tarjeta -->
        <button id="btn-cerrar-panel">X</button>
        
        <h3 id="titulo-objeto">Bienvenido</h3>
        <div id="contenido-respuestas">
            <p>Haz clic en una figura para cargar sus respuestas aquí.</p>
        </div>
    </div>
    
    <script src="visor3d-main.js"></script>
</body>
</html>
