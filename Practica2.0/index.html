<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D Interactivo con Información de Objetos</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Map para Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Panel de Controles -->
    <div id="controls-panel">
        <h3>Controles</h3>
        <button id="btn-anim">Pausar Animación</button>
        <button id="btn-reset">Reiniciar Cámara</button>
        <label for="light-slider">Luz Direccional:</label>
        <input type="range" id="light-slider" min="0" max="5" step="0.1" value="2">
    </div>

    <!-- Panel de Información (Oculto por defecto) -->
    <div id="info-panel" class="hidden">
        <h2 id="info-name">Nombre del Objeto</h2>
        <p><strong>Tipo:</strong> <span id="info-type">...</span></p>
        <p><strong>Descripción:</strong> <span id="info-desc">...</span></p>
        <p><strong>Dato Extra:</strong> <span id="info-extra">...</span></p>
        <button id="btn-close-info">Cerrar</button>
    </div>

    <!-- Script principal -->
    <script type="module" src="main.js"></script>
</body>
</html>
