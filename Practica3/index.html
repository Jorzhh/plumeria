<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Botánico - Plumeria 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Panel de Información de la Planta -->
    <div id="info-panel" class="hidden">
        <h2 id="info-name">Parte de la planta</h2>
        <p><strong>Geometría:</strong> <span id="info-type">...</span></p>
        <p><strong>Altura (Aprox):</strong> <span id="info-height">...</span></p>
        <p><strong>Función:</strong> <span id="info-desc">...</span></p>
    </div>

    <!-- Controles HTML -->
    <div id="controls">
        <button id="btn-anim">Viento: On/Off</button>
        <button id="btn-color-hojas">Cambiar Color Hojas</button>
        <button id="btn-toggle-hojas">Ocultar/Mostrar Hojas</button>
        <button id="btn-reset">Reiniciar Cámara</button>
        <label for="light-slider">Luz:</label>
        <input type="range" id="light-slider" min="0" max="2" step="0.1" value="1">
    </div>

    <!-- Marca de agua -->
    <div id="creditos">Práctica 3: Construcción Jerárquica - Humberto Josue Orozco Espinosa y Irlanda Goreti Alvarez Lomeli</div>

    <!-- Carga de Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
